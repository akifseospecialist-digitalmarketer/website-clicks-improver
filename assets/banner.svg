<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-label="Website Clicks Improver: a Claude skill that turns Google Search Console data into more clicks">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070d1c"/>
      <stop offset="0.55" stop-color="#0d1730"/>
      <stop offset="1" stop-color="#101a3a"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="600" y2="0" gradientUnits="userSpaceOnUse" spreadMethod="reflect">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="0.5" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#34d399"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="0 0;600 0;0 0" dur="8s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/><stop offset="1" stop-color="#34d399"/>
    </linearGradient>
    <radialGradient id="orbA"><stop offset="0" stop-color="#22d3ee" stop-opacity=".45"/><stop offset="1" stop-color="#22d3ee" stop-opacity="0"/></radialGradient>
    <radialGradient id="orbB"><stop offset="0" stop-color="#a78bfa" stop-opacity=".40"/><stop offset="1" stop-color="#a78bfa" stop-opacity="0"/></radialGradient>
    <radialGradient id="orbC"><stop offset="0" stop-color="#34d399" stop-opacity=".30"/><stop offset="1" stop-color="#34d399" stop-opacity="0"/></radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity=".045"/>
    </pattern>
    <clipPath id="frame"><rect width="1200" height="400" rx="22"/></clipPath>
  </defs>

  <style>
    .f { font-family: 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif; }
    .mono { font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace; }
    .fade1 { opacity: 0; animation: fade .9s ease-out .2s forwards; }
    .fade2 { opacity: 0; animation: fade .9s ease-out .6s forwards; }
    .fade3 { opacity: 0; animation: fade .9s ease-out 1.0s forwards; }
    .fade4 { opacity: 0; animation: fade .9s ease-out 1.4s forwards; }
    @keyframes fade { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
    .float { animation: float 6s ease-in-out infinite; }
    .float2 { animation: float 7s ease-in-out -2s infinite; }
    @keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
    .old { animation: old 7s ease-in-out infinite; }
    @keyframes old { 0%,30% { opacity: 1; } 40%,90% { opacity: .35; } 100% { opacity: 1; } }
    .strike { transform-box: fill-box; transform-origin: left; animation: strike 7s ease-in-out infinite; }
    @keyframes strike { 0%,25% { transform: scaleX(0); } 35%,90% { transform: scaleX(1); } 100% { transform: scaleX(0); } }
    .new { opacity: 0; animation: newin 7s ease-in-out infinite; }
    @keyframes newin { 0%,38% { opacity: 0; transform: translateY(6px); } 48%,90% { opacity: 1; transform: translateY(0); } 100% { opacity: 0; } }
    .lowctr { animation: lowctr 7s ease-in-out infinite; }
    @keyframes lowctr { 0%,40% { opacity: 1; } 48%,92% { opacity: 0; } 100% { opacity: 1; } }
    .hictr { opacity: 0; animation: hictr 7s ease-in-out infinite; }
    @keyframes hictr { 0%,44% { opacity: 0; } 52%,90% { opacity: 1; } 100% { opacity: 0; } }
    .draw { stroke-dasharray: 420; stroke-dashoffset: 420; animation: draw 7s ease-in-out infinite; }
    @keyframes draw { 0%,10% { stroke-dashoffset: 420; } 60%,90% { stroke-dashoffset: 0; } 100% { stroke-dashoffset: 420; } }
    .chunk { opacity: 0; animation: chunk 7s ease-out infinite; }
    .c2 { animation-delay: .35s; } .c3 { animation-delay: .7s; }
    @keyframes chunk { 0%,50% { opacity: 0; transform: translateX(-8px); } 60%,92% { opacity: 1; transform: translateX(0); } 100% { opacity: 0; } }
  </style>

  <g clip-path="url(#frame)">
    <rect width="1200" height="400" fill="url(#bg)"/>
    <rect width="1200" height="400" fill="url(#grid)"/>

    <circle r="220" fill="url(#orbA)">
      <animate attributeName="cx" values="120;260;120" dur="14s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="60;140;60" dur="14s" repeatCount="indefinite"/>
    </circle>
    <circle r="260" fill="url(#orbB)">
      <animate attributeName="cx" values="1050;900;1050" dur="16s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="360;260;360" dur="16s" repeatCount="indefinite"/>
    </circle>
    <circle r="180" fill="url(#orbC)">
      <animate attributeName="cx" values="640;720;640" dur="12s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="420;330;420" dur="12s" repeatCount="indefinite"/>
    </circle>

    <!-- Left: text -->
    <g class="f">
      <g class="fade1">
        <rect x="70" y="62" width="262" height="30" rx="15" fill="#22d3ee" fill-opacity=".12" stroke="#22d3ee" stroke-opacity=".5"/>
        <circle cx="90" cy="77" r="5" fill="#34d399"><animate attributeName="opacity" values="1;.25;1" dur="1.6s" repeatCount="indefinite"/></circle>
        <text x="104" y="82" font-size="14" font-weight="600" fill="#a5f3fc" letter-spacing=".5">CLAUDE SKILL · GSC · v1.0</text>
      </g>
      <text class="fade2" x="68" y="160" font-size="62" font-weight="800" fill="url(#title)" letter-spacing="-1">Website Clicks</text>
      <text class="fade3" x="70" y="214" font-size="44" font-weight="700" fill="#f8fafc">Improver</text>
      <text class="fade4" x="70" y="258" font-size="19" fill="#94a3b8">Search Console data  →  fixes  →  more clicks</text>

      <g class="fade4 mono" font-size="13" font-weight="600">
        <rect x="70" y="292" width="150" height="36" rx="10" fill="#0f172a" stroke="#334155"/>
        <text x="86" y="315" fill="#f87171">Low CTR</text><text x="152" y="315" fill="#cbd5e1">→ titles</text>
        <rect x="230" y="292" width="170" height="36" rx="10" fill="#0f172a" stroke="#334155"/>
        <text x="246" y="315" fill="#fbbf24">Page 2-3</text><text x="320" y="315" fill="#cbd5e1">→ page 1</text>
        <rect x="410" y="292" width="196" height="36" rx="10" fill="#0f172a" stroke="#334155"/>
        <text x="426" y="315" fill="#34d399">Missing kw</text><text x="514" y="315" fill="#cbd5e1">→ chunks</text>
      </g>
    </g>

    <!-- Right: SERP result card being rewritten -->
    <g class="float">
      <g transform="translate(676,58)">
        <rect width="444" height="182" rx="16" fill="#0b1324" stroke="#334155"/>
        <rect width="444" height="36" rx="16" fill="#111c33"/>
        <rect y="20" width="444" height="16" fill="#111c33"/>
        <circle cx="22" cy="18" r="6" fill="#f87171"/><circle cx="42" cy="18" r="6" fill="#fbbf24"/><circle cx="62" cy="18" r="6" fill="#34d399"/>
        <rect x="88" y="9" width="270" height="18" rx="9" fill="#1e293b"/>
        <text x="100" y="22" class="mono" font-size="11" fill="#94a3b8">google.com/search?q=teeth+whitening</text>

        <g class="f">
          <text x="22" y="62" font-size="11" fill="#64748b">www.yoursite.com › services › teeth-whitening</text>
          <!-- old title -->
          <g class="old">
            <text x="22" y="86" font-size="16" fill="#93c5fd">Teeth Whitening Services | Your Clinic Name Su…</text>
          </g>
          <rect class="strike" x="22" y="80" width="356" height="2.5" rx="1" fill="#f87171"/>
          <!-- new title -->
          <g class="new">
            <text x="22" y="110" font-size="16" font-weight="600" fill="#86efac">Teeth Whitening Parramatta | Results in One Visit</text>
          </g>
          <rect x="22" y="124" width="380" height="7" rx="3.5" fill="#1e293b"/>
          <rect x="22" y="138" width="300" height="7" rx="3.5" fill="#1e293b"/>

          <!-- CTR chip -->
          <rect x="22" y="152" width="150" height="20" rx="10" fill="#111c33" stroke="#334155"/>
          <text x="34" y="166" font-size="11" fill="#94a3b8">CTR</text>
          <g class="lowctr"><text x="62" y="166" font-size="12" font-weight="700" fill="#fca5a5">1.1% (pos 4)</text></g>
          <g class="hictr"><text x="62" y="166" font-size="12" font-weight="700" fill="#6ee7b7">3.4%  ▲ +209%</text></g>
        </g>
      </g>
    </g>

    <!-- Content chunks being added -->
    <g class="f" transform="translate(676,256)">
      <rect width="290" height="104" rx="14" fill="#0b1324" stroke="#334155"/>
      <text x="16" y="24" font-size="12" font-weight="700" fill="#cbd5e1">Content chunks to add</text>
      <g class="chunk"><rect x="16" y="36" width="8" height="16" rx="2" fill="#34d399"/><text x="32" y="49" font-size="11" fill="#e2e8f0">FAQ · "is teeth whitening safe"</text></g>
      <g class="chunk c2"><rect x="16" y="58" width="8" height="16" rx="2" fill="#22d3ee"/><text x="32" y="71" font-size="11" fill="#e2e8f0">Pricing · "teeth whitening cost"</text></g>
      <g class="chunk c3"><rect x="16" y="80" width="8" height="16" rx="2" fill="#a78bfa"/><text x="32" y="93" font-size="11" fill="#e2e8f0">Section · "zoom teeth whitening"</text></g>
    </g>

    <!-- Position climbing chart -->
    <g transform="translate(980,256)"><g class="float2">
      <rect width="140" height="104" rx="14" fill="#0b1324" stroke="#334155"/>
      <text x="14" y="22" class="f" font-size="11" font-weight="700" fill="#cbd5e1">Position</text>
      <text x="14" y="94" class="mono" font-size="10" fill="#fbbf24">18</text>
      <text x="112" y="40" class="mono" font-size="10" fill="#34d399">6</text>
      <polyline class="draw" points="30,88 52,82 70,74 88,60 104,50 120,44" fill="none" stroke="url(#line)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      <line x1="14" y1="66" x2="126" y2="66" stroke="#475569" stroke-dasharray="3 3"/>
      <text x="80" y="78" class="f" font-size="8" fill="#64748b">page 1</text>
    </g></g>
  </g>
  <rect x=".5" y=".5" width="1199" height="399" rx="22" fill="none" stroke="#ffffff" stroke-opacity=".08"/>
</svg>
